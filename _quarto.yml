project:
  type: website
  output-dir: _site
  execute-dir: project
  pre-render: Rscript data-raw/make-synthetic.R
  render:
    - index.qmd
    - foreword.qmd
    - bowel-cancer.qmd
    - breast-cancer.qmd
    - cervical-cancer.qmd
    - instructions.qmd
    - exercises/*.qmd
    - exercises/attendees/*.qmd
    - slides/git-foundations.qmd
  resources:
    - downloads/

website:
  title: "Victorian Cancer Screening Statistical Report"
  description: "Training demo built with Quarto. All figures are synthetic."
  favicon: assets/favicon.svg
  page-navigation: true
  sidebar:
    style: docked
    logo: assets/wordmark.svg
    logo-alt: "Cancer Screening Report (training demo)"
    contents:
      - text: Summary
        href: index.qmd
      - foreword.qmd
      - bowel-cancer.qmd
      - breast-cancer.qmd
      - cervical-cancer.qmd
      - instructions.qmd
      - section: "Git training"
        contents:
          - text: "Slides (PDF)"
            href: slides/git-foundations.qmd
          - exercises/index.qmd
          - exercises/00-setup.qmd
          - exercises/01-first-pull-request.qmd
          - exercises/02-change-a-chart.qmd
          - exercises/03-sql-diff.qmd
          - exercises/04-committed-data.qmd
          - exercises/05-revert.qmd
          - exercises/cheatsheet.qmd
          - exercises/attendees.qmd
    tools:
      - icon: box-arrow-up-right
        href: https://www.acpcc.org.au/
        text: Return to main site
  page-footer:
    left: "Training demo · Synthetic data only · Not an ACPCC publication"
    right: "Built with [Quarto](https://quarto.org/) and R"

format:
  html:
    theme: [cosmo, assets/acpcc.scss]
    page-layout: full
    toc: false
    title-block-style: none
    include-before-body: assets/banner.html
    include-after-body: assets/behaviour.html
    link-external-newwindow: true
    smooth-scroll: true

execute:
  echo: false
  warning: false
  message: false
