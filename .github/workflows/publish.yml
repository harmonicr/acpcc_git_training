name: Render and publish

# Every push renders the site and slides, so each branch (and its pull
# request) gets a check. Only pushes to main publish to GitHub Pages.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. A newer push cancels an older run, except on
# main, where every merge should finish publishing.
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  render:
    runs-on: ubuntu-latest
    # R, the tidyverse, Quarto, pandoc and TinyTeX, pinned to one R release.
    container: rocker/verse:4.6.2
    env:
      RENV_PATHS_CACHE: /github/home/.cache/R/renv
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Restore cached R packages
        uses: actions/cache@v6
        with:
          path: /github/home/.cache/R/renv
          key: renv-${{ hashFiles('renv.lock') }}
          restore-keys: renv-

      - name: Install R packages from renv.lock
        run: Rscript -e 'renv::restore(prompt = FALSE)'

      - name: Install LaTeX packages for the slides
        run: tlmgr install beamer beamertheme-metropolis unicode-math booktabs caption fira float

      # The pre-render step in _quarto.yml rebuilds the synthetic database.
      - name: Render the site and slides
        run: quarto render

      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Upload a preview of the site
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: _site
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
